<div class="carousel-container">
    <button class="nav" (click)="prevSlide()" [disabled]="currentIndex === 0">
        <fa-icon [icon]="faChevronCircleLeft"></fa-icon>
    </button>

    <div class="image-container">
        <img
            *ngIf="modalImages.length"
            [src]="modalImages?.[currentIndex]" 
            alt="image"
            class="image">

            <div class="counter roboto-mono-font">
                {{ currentIndex + 1 | number:'2.0' }}
                <span></span>
                {{ modalImages.length | number:'2.0' }}
            </div>
    </div>

    <button class="nav" (click)="nextSlide()" [disabled]="currentIndex === modalImages.length - 1">
        <fa-icon [icon]="faChevronCircleRight" ></fa-icon>
    </button>
</div>
