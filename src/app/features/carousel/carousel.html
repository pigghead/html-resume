<div class="carousel">
    <!-- <fa-icon [icon]="faChevronLeft" (click)="previousSlide()" class="nav" [class.disabled]="currentIndex === 0"></fa-icon> -->
     <button 
        class="nav nav--previous"
        aria-label="previous project"
        (click)="previousSlide()">

        <fa-icon [icon]="faChevronLeft"></fa-icon>
    </button>

    <div class="content">
        <div
            class="project-card-wrapper"
            *ngFor="let item of items; let i = index"
            [ngClass]="getSlideClass(i)">
            <app-project-card 
                [project]="item"
                (learnMore)="onLearnMore($event)">
            </app-project-card>
            <!-- [active]="i===currentIndex" -->
        </div>
    </div>

    <!-- <fa-icon [icon]="faChevronRight" (click)="nextSlide()" class="nav" [class.disabled]="currentIndex === items.length - 1"></fa-icon> -->
    <button 
        class="nav nav--next"
        aria-label="next project"
        (click)="nextSlide()">

        <fa-icon [icon]="faChevronRight"></fa-icon>
    </button>
</div>
