<article class="project-card">

    <div class="image-wrapper">
        <img 
            [src]="project.image" 
            [alt]="project.name" 
            class="image">
    </div>

    <div class="content">
        <div class="project-index roboto-mono-font">
            PROJECT
        </div>
        <h2 class="title roboto-mono-font">{{ project.name }}</h2>
        <p class="subtitle roboto-mono-font">{{ project.subtitle}}</p>
        <!-- <p class="description roboto-mono-font">{{ project.description }}</p> -->
        <button
            *ngIf="active"
            type="button" 
            class="learn-more roboto-mono-font"
            (click)="onLearnMore()">

            <span>Learn More</span>
            <span class="arrow">→</span>
        </button>
        <a class="link" (click)="onLearnMore()">Learn More</a>
    </div>
</article>
